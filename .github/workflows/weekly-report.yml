name: Weekly ZGA/MZT paper report

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Word report
        run: python scripts/weekly_zga_mzt_report.py

      - name: Upload Word report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-zga-mzt-report
          path: reports/*.docx

      - name: Commit report to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports/*.docx
          git commit -m "Add weekly ZGA/MZT paper report" || echo "No changes to commit"
          git push
